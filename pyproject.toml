[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "free-video-edit-mcp"
version = "0.1.0"
description = "Free open-source MCP server for programmatic video editing via FFmpeg (public tool-surface alternative to Resolve MCP)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "free-video-edit-mcp contributors" }]
keywords = ["mcp", "ffmpeg", "video", "editing", "ai-agent"]
dependencies = [
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
free-video-edit-mcp = "free_video_edit_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
